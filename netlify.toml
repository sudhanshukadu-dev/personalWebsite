# Netlify build settings. Netlify's Next.js runtime picks up the .next output and
# serves pages, images and routes from it.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly (and installed as a dev dependency): uploads through the API
# don't get the runtime added automatically, and without it nothing is served.
[[plugins]]
  package = "@netlify/plugin-nextjs"
